sonar.organization=cse210-team-404-not-found
sonar.projectKey=CSE210-Team-404-Not-Found_warmup-charts

sonar.sources=src,demo,benchmark,index.html,style.css
sonar.tests=test,e2e

# Node's tests write lcov.info; the Playwright tests write the other one.
sonar.javascript.lcov.reportPaths=lcov.info,test-results/e2e-lcov.info
# Code neither set of tests reaches: the benchmark page, and the worker,
# which page-level browser coverage cannot see.
sonar.coverage.exclusions=benchmark/**,src/worker.js
