# Checks on every push, SonarQube Cloud analysis of main and pull requests,
# release pull requests on main, and the GitHub Pages deploy of each release
# tag. See ADR-0013, ADR-0014 and ADR-0015.

version: 2.1

orbs:
  sonarcloud: sonarsource/sonarcloud@4.0

executors:
  node:
    docker:
      - image: cimg/node:22.23

jobs:
  check:
    executor: node
    steps:
      - checkout
      - run: npm ci
      - run: npm run lint
      - run: npm test

  analyze:
    executor: node
    steps:
      - checkout
      - run: .circleci/scripts/halt-unless-main-or-pull-request.sh
      - run: npm ci
      - run: npm run coverage
      - sonarcloud/scan

  release:
    executor: node
    environment:
      REPOSITORY: << pipeline.git.repo_owner >>/<< pipeline.git.repo_name >>
    steps:
      - checkout
      - run: .circleci/scripts/release.sh

  deploy:
    executor: node
    environment:
      REPOSITORY: << pipeline.git.repo_owner >>/<< pipeline.git.repo_name >>
    steps:
      - checkout
      - add_ssh_keys
      - run: .circleci/scripts/stage-site.sh _site
      - run: .circleci/scripts/publish-branch.sh _site gh-pages

workflows:
  check-and-deploy:
    # A job runs on a release tag only if it, and every job it requires, has a
    # tags filter. Branches are unaffected by a tags filter.
    jobs:
      - check:
          filters:
            tags:
              only: /^v.*/
      - analyze:
          context: SonarCloud
      - release:
          context: GitHub
          requires: [check]
          filters:
            branches:
              only: main
      - deploy:
          requires: [check]
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
