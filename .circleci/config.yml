# Checks on every push, and the GitHub Pages deploy of main. See ADR-0013.

version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:22.23

jobs:
  check:
    executor: node
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-{{ checksum "package-lock.json" }}
      - run: npm ci
      - save_cache:
          key: npm-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run: npm run lint
      - run: npm test

  deploy:
    executor: node
    environment:
      REPOSITORY: << pipeline.git.repo_owner >>/<< pipeline.git.repo_name >>
    steps:
      - checkout
      - add_ssh_keys
      - run: .circleci/scripts/stage-site.sh _site
      - run: .circleci/scripts/publish-branch.sh _site gh-pages

workflows:
  check-and-deploy:
    jobs:
      - check
      - deploy:
          requires: [check]
          filters:
            branches:
              only: main
