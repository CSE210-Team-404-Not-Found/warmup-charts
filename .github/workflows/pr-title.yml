# Require a Conventional Commit title on every pull request. The title becomes
# the commit on main when the pull request is squash-merged, and release-please
# reads it for the version and the changelog. See ADR-0015 and docs/releases.md.
#
# This runs on GitHub Actions, not CircleCI, because it has to rerun when the
# title is edited, which only GitHub sees.

name: PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
