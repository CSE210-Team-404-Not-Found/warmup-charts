# Deploys the repository to GitHub Pages.
#
# Owned by the backend team.
#
# Publishes the demo page on every push to main (ADR-0008). Based on GitHub's
# starter workflow for static Pages sites.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

      # Stage only browser assets; do not deploy npm dependencies or tests.
      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html style.css _site/
          cp -R src demo data images _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - id: deployment
        uses: actions/deploy-pages@v5
